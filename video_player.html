<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画再生 - カグチカ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="./video_list.html" class="header-back">戻る</a>
            <h1>動画再生</h1>
        </header>
        <main>
            <div class="img-box" style="height:220px; position:relative;">
                <img src="./images/video_thumb_01.png" alt="再生プレイヤー">
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50px; height:50px; background:rgba(0,0,0,0.7); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#fff; font-size:24px;">▶</div>
            </div>
            <div class="card">
                <div class="card-title">演目：大蛇（架空版）</div>
                <p style="font-size:13px; color:#444;">社中：サンプル社中 | 公演日：202X年〇月〇日</p>
                <p style="font-size:12px; color:#666; margin-top:6px;">石見神楽を代表する演目。退治される八岐大蛇の躍動感ある舞が最大のみどころです。</p>
            </div>
            <div class="btn-group">
                <a href="./video_list.html" class="btn btn-secondary">戻る</a>
            </div>
        </main>
        <footer>© カグチカ！ Project</footer>
    </div>
    <script src="./script.js"></script>
