<!DOCTYPE html>
<html lang="ja">
<head>

                <div class="card-title">環境設定</div>

                </div>
                <div class="toggle-group">
                    <span>設定2 SE</span>

            </div>
            <div class="btn-group">
                <a href="./mypage.html" class="btn">マイページ</a>
