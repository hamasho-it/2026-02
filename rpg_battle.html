<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 戦闘 - カグチカ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>戦闘画面</h1>
        </header>
        <main>
            <div style="display:flex; gap:10px;">
                <div style="flex:1; text-align:center;">
                    <div style="font-size:11px; font-weight:bold;">自キャラクター</div>
                    <div class="hp-bar-container"><div class="hp-bar" style="width:80%;"></div></div>
                    <div class="img-box" style="height:100px;">
                        <img src="./images/rpg_hero.png" alt="自キャラクター">
                    </div>
                </div>
                <div style="flex:1; text-align:center;">
                    <div style="font-size:11px; font-weight:bold;">敵キャラクター</div>
                    <div class="hp-bar-container"><div class="hp-bar" style="width:60%; background:#888;"></div></div>
                    <div class="img-box" style="height:100px;">
                        <img src="./images/rpg_enemy.png" alt="敵キャラクター">
                    </div>
                </div>
            </div>
            <div class="card" style="min-height:60px; padding:8px;">
                <p id="battle-log" style="font-size: 16px; color:#333;">技を繰り出して敵の体力をなくせば勝ち</p>
            </div>
            <div class="btn-group">
                <div class="btn-row">
                    <button class="btn rpg-action-btn">技1</button>
                    <button class="btn rpg-action-btn">技2</button>
                </div>
                <div class="btn-row">
                    <button class="btn rpg-action-btn">技3</button>
                    <button class="btn rpg-action-btn">技4</button>
                </div>
                <button class="btn rpg-action-btn">攻撃</button>
            </div>
            <div class="btn-row">
                <a href="./rpg_enemy_info.html" class="btn btn-secondary" style="font-size: 16px;">敵情報</a>
                <a href="./rpg_item_select.html" class="btn btn-secondary" style="font-size: 16px;">アイテム</a>
                <a href="./rpg_story_select.html" class="btn btn-outline" style="font-size: 16px;">中断</a>
            </div>
            <div class="btn-row">
                <a href="./rpg_victory.html" class="btn btn-secondary" style="font-size:11px;">[デモ] 勝利画面へ</a>
                <a href="./rpg_gameover.html" class="btn btn-secondary" style="font-size:11px;">[デモ] 敗北画面へ</a>
            </div>
        </main>
        <footer>© カグチカ！ Project</footer>
<!-- モンスト風下部ナビゲーションバー (親指操作・AI解説明記) -->
        <nav class="bottom-nav">
            
            <a href="./index.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">🏠</span>
                <span>ホーム</span>
            </a>
            <a href="./seat_reservation.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">🎟️</span>
                <span>座席予約</span>
            </a>
            <a href="./ai_select.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">💡</span>
                <span>AI解説</span>
            </a>
            <a href="./video_list.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">📺</span>
                <span>動画</span>
            </a>
            <a href="./manga_select.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">📖</span>
                <span>漫画</span>
            </a>
            <a href="./gacha_select.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">🎰</span>
                <span>ガチャ</span>
            </a>
            <a href="./rpg_top.html" class="bottom-nav-item active">
                <span class="bottom-nav-icon">⚔️</span>
                <span>RPG</span>
            </a>
            <a href="./setting.html" class="bottom-nav-item">
                <span class="bottom-nav-icon">⚙️</span>
                <span>設定</span>
            </a>
        </nav>


    </div>
    <script src="./script.js"></script>
</body>
</html>
