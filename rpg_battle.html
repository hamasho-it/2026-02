<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 戦闘 - カグチカ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>戦闘画面</h1>
        </header>
        <main>
            <div style="display:flex; gap:10px;">
                <div style="flex:1; text-align:center;">
                    <div style="font-size:11px; font-weight:bold;">自キャラ</div>
                    <div class="hp-bar-container"><div class="hp-bar" style="width:80%;"></div></div>
                    <div class="img-box" style="height:100px;">
                        <img src="./images/rpg_hero.png" alt="自キャラ">
                    </div>
                </div>
                <div style="flex:1; text-align:center;">
                    <div style="font-size:11px; font-weight:bold;">敵キャラ</div>
                    <div class="hp-bar-container"><div class="hp-bar" style="width:60%; background:#888;"></div></div>
                    <div class="img-box" style="height:100px;">
                        <img src="./images/rpg_enemy.png" alt="敵キャラ">
                    </div>
                </div>
            </div>
            <div class="card" style="min-height:60px; padding:8px;">
                <p id="battle-log" style="font-size:12px; color:#333;">八岐大蛇が現れた！どうする？</p>
            </div>
            <div class="btn-group">
                <div class="btn-row">
                    <button class="btn rpg-action-btn">技1</button>
                    <button class="btn rpg-action-btn">技2</button>
                </div>
                <div class="btn-row">
                    <button class="btn rpg-action-btn">技3</button>
                    <button class="btn rpg-action-btn">技4</button>
                </div>
                <button class="btn rpg-action-btn">攻撃</button>
            </div>
            <div class="btn-row" style="margin-top:6px;">
                <a href="./rpg_enemy_info.html" class="btn btn-secondary" style="font-size:12px;">敵情報</a>
                <a href="./rpg_item_select.html" class="btn btn-secondary" style="font-size:12px;">アイテム</a>
                <a href="./rpg_story_select.html" class="btn btn-outline" style="font-size:12px;">中断</a>
            </div>
        </main>
        <footer>© カグチカ！ Project</footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
