<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>場所・日時選択 - カグチカ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="./seat_reservation.html" class="header-back">戻る</a>
            <h1>場所・日時選択</h1>
        </header>
        <main>
            <div class="form-group">
                <label>開催場所を選択</label>
                <select class="form-control">
                    <option>サンプル神楽殿（サンプル町1-1）</option>
                    <option>サンプル町ホール（サンプル町2-3）</option>
                </select>
            </div>
            <div class="form-group">
                <label>公演日時を選択</label>
                <select class="form-control">
                    <option>202X年〇月〇日 13:00〜 (昼の部)</option>
                    <option>202X年〇月〇日 18:00〜 (夜の部)</option>
                </select>
            </div>
            <div class="btn-group" style="margin-top:20px;">
                <a href="./seat_select_shachu.html" class="btn">選択</a>
                <a href="./seat_reservation.html" class="btn btn-outline">戻る</a>
            </div>
        </main>
        <footer>© カグチカ！ Project</footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
